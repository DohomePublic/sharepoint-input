<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin KYC</title><script src="./assets/msal-browser.min.js"></script><style>:root{--b:#0f6cbd;--bg:#f4f7fb;--c:#fff;--t:#17233b;--m:#667085;--l:#dce5f0;--r:#c4314b}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Tahoma,sans-serif;background:var(--bg);color:var(--t)}header{padding:24px;color:#fff;background:linear-gradient(125deg,#073763,#0f6cbd,#39a9e8)}h1{margin:0}.wrap{max-width:850px;margin:24px auto;padding:0 16px}.card{background:var(--c);border:1px solid var(--l);border-radius:18px;box-shadow:0 12px 30px #17365d18;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--l)}button{border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer}.primary{background:var(--b);color:#fff}.secondary{background:#eaf3fc;color:#0b568f}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}.req{color:var(--r)}input{width:100%;padding:12px;border:1px solid #cbd6e2;border-radius:10px;font:inherit}.actions{display:flex;gap:10px;margin-top:22px}.msg{display:none;margin-top:18px;padding:13px;border-radius:10px;white-space:pre-wrap;word-break:break-word}.ok{display:block;background:#e8f6e8;color:#126b12}.err{display:block;background:#fdeaea;color:#a61b1b}.wait{display:block;background:#fff4d6;color:#835b00}.hint{font-size:12px;color:var(--m);margin-top:6px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header><h1>Admin KYC</h1><div>บันทึกข้อมูลเข้า SharePoint List Admin_Kyc</div></header><main class="wrap"><section class="card"><div class="top"><div><b id="who">กำลังเตรียมระบบเข้าสู่ระบบ...</b><div class="hint">บัญชี Microsoft 365 ขององค์กร</div></div><div><button type="button" id="login" class="secondary" disabled>เข้าสู่ระบบ</button> <button type="button" id="logout" class="secondary" hidden>ออกจากระบบ</button></div></div><div id="message" class="msg"></div><form id="form"><div class="grid"><div><label>รหัสพนักงาน <span class="req">*</span></label><input id="Title" required placeholder="1046553"></div><div><label>Email <span class="req">*</span></label><input id="Email" type="email" required placeholder="name@dohome.co.th"></div><div><label>ชื่อ - นามสกุล <span class="req">*</span></label><input id="Full_Name" required placeholder="Jumbo Pongsapan"></div><div><label>แผนก <span class="req">*</span></label><input id="depart" required placeholder="IT"></div></div><div class="actions"><button id="save" class="primary" type="submit" disabled>บันทึกเข้า SharePoint</button><button class="secondary" type="reset">ล้างข้อมูล</button></div></form><div class="hint" style="margin-top:16px">ปลายทาง: dohomegroup.sharepoint.com/sites/KYC • Admin_Kyc</div></section></main><script>
const CONFIG={tenantId:'7f8918d9-718a-495b-ac9a-17cba381c4a0',clientId:'012ac5e6-9487-4436-9e0e-246c19ab2a67',redirectUri:'https://dohomepublic.github.io/sharepoint-web/',siteHost:'dohomegroup.sharepoint.com',sitePath:'/sites/KYC',listName:'Admin_Kyc',scopes:['Sites.ReadWrite.All']};
(()=>{'use strict';const $=id=>document.getElementById(id);let msalApp=null,account=null,ready=false,siteId=null,listId=null;function message(text,type){$('message').className='msg '+type;$('message').textContent=text}function ui(){$('who').textContent=account?'เข้าสู่ระบบ: '+(account.name||account.username):ready?'ยังไม่ได้เข้าสู่ระบบ':'กำลังเตรียมระบบเข้าสู่ระบบ...';$('login').disabled=!ready;$('save').disabled=!ready;$('logout').hidden=!account}async function initializeMSAL(){try{if(!window.msal||!window.msal.PublicClientApplication)throw new Error('ไม่พบไฟล์ assets/msal-browser.min.js กรุณาอัปโหลดโฟลเดอร์ assets ไปพร้อม index.html');msalApp=new window.msal.PublicClientApplication({auth:{clientId:CONFIG.clientId,authority:'https://login.microsoftonline.com/'+CONFIG.tenantId,redirectUri:CONFIG.redirectUri,postLogoutRedirectUri:CONFIG.redirectUri},cache:{cacheLocation:'sessionStorage',storeAuthStateInCookie:false}});if(typeof msalApp.initialize==='function')await msalApp.initialize();if(typeof msalApp.handleRedirectPromise==='function')await msalApp.handleRedirectPromise();account=msalApp.getAllAccounts()[0]||null;if(account&&msalApp.setActiveAccount)msalApp.setActiveAccount(account);ready=true;ui()}catch(e){ready=false;ui();message('เริ่มระบบ Login ไม่สำเร็จ\n'+e.message,'err')}}async function signIn(){if(!ready||!msalApp)throw new Error('ระบบ Microsoft Login ยังไม่พร้อม กรุณารีเฟรชหน้าเว็บ');const result=await msalApp.loginPopup({scopes:CONFIG.scopes,prompt:'select_account'});if(!result.account)throw new Error('ไม่พบบัญชีหลังเข้าสู่ระบบ');account=result.account;if(msalApp.setActiveAccount)msalApp.setActiveAccount(account);ui();return account}async function accessToken(){if(!account){const cached=msalApp.getAllAccounts();if(cached.length){account=cached[0];if(msalApp.setActiveAccount)msalApp.setActiveAccount(account)}else await signIn()}const req={account,scopes:CONFIG.scopes};try{return(await msalApp.acquireTokenSilent(req)).accessToken}catch{return(await msalApp.acquireTokenPopup(req)).accessToken}}async function graph(url,options={}){const token=await accessToken();const response=await fetch(url,{...options,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json',...(options.headers||{})}});if(!response.ok)throw new Error('Microsoft Graph '+response.status+': '+await response.text());return response.json()}async function resolveIds(){if(!siteId)siteId=(await graph('https://graph.microsoft.com/v1.0/sites/'+CONFIG.siteHost+':'+CONFIG.sitePath)).id;if(!listId){const data=await graph('https://graph.microsoft.com/v1.0/sites/'+siteId+'/lists?$select=id,displayName');const list=(data.value||[]).find(x=>String(x.displayName).toLowerCase()===CONFIG.listName.toLowerCase());if(!list)throw new Error('ไม่พบ SharePoint List '+CONFIG.listName);listId=list.id}}$('login').onclick=()=>signIn().then(()=>message('เข้าสู่ระบบสำเร็จ','ok')).catch(e=>message('เข้าสู่ระบบไม่สำเร็จ\n'+e.message,'err'));$('logout').onclick=()=>msalApp.logoutPopup({account,postLogoutRedirectUri:CONFIG.redirectUri});$('form').onsubmit=async e=>{e.preventDefault();if(!e.target.reportValidity())return;$('save').disabled=true;message('กำลังบันทึกข้อมูล...','wait');try{await resolveIds();const fields={Title:$('Title').value.trim(),Email:$('Email').value.trim(),Full_Name:$('Full_Name').value.trim(),depart:$('depart').value.trim()};const item=await graph('https://graph.microsoft.com/v1.0/sites/'+siteId+'/lists/'+listId+'/items',{method:'POST',body:JSON.stringify({fields})});message('บันทึกสำเร็จ\nItem ID: '+item.id,'ok');e.target.reset()}catch(err){message('บันทึกไม่สำเร็จ\n'+err.message,'err')}finally{$('save').disabled=!ready}};document.addEventListener('DOMContentLoaded',initializeMSAL);ui()})();
</script></body></html>
