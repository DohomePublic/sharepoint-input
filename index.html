<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DOHOME KYC</title><script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script><script src="config.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f3f6f9;color:#17212b;font-family:Segoe UI,Tahoma,sans-serif}header{padding:22px 5%;color:#fff;background:linear-gradient(120deg,#123b5d,#1f5d8c);display:flex;justify-content:space-between;gap:16px;align-items:center}h1{font-size:22px;margin:0}main{max-width:1120px;margin:24px auto;padding:0 16px}.card{background:#fff;border:1px solid #d7dee7;border-radius:14px;padding:22px;margin-bottom:18px;box-shadow:0 5px 18px #17324d0d}.card h2{font-size:18px;color:#123b5d;border-bottom:1px solid #d7dee7;padding-bottom:10px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.wide{grid-column:1/-1}label{display:block;font-size:13px;font-weight:600;margin-bottom:7px}input,select,textarea{width:100%;padding:11px;border:1px solid #b9c5d2;border-radius:8px;font:inherit}button{border:0;border-radius:8px;padding:11px 17px;font-weight:700;cursor:pointer}.login{background:#e8edf2}.submit{background:#198754;color:#fff}.actions{position:sticky;bottom:0;background:#fffffff2;padding:14px;border:1px solid #d7dee7;border-radius:12px;display:flex;justify-content:flex-end;gap:10px}.msg{display:none;padding:13px;border-radius:9px;margin-bottom:15px}.ok{display:block;background:#e9f7ef;color:#12643a}.err{display:block;background:#fff0ef;color:#8c1d18}@media(max-width:760px){header{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}}</style></head><body><header><div><h1>DOHOME KYC MANAGEMENT SYSTEM</h1><div>Customer Credit Approval Workflow</div></div><div><span id="who">ยังไม่ได้เข้าสู่ระบบ</span> <button id="login" class="login">Microsoft Login</button></div></header><main><div id="msg" class="msg"></div><form id="form"><section class="card"><h2>ข้อมูลลูกค้า</h2><div class="grid"><div><label>Customer ID *</label><input id="Customer_id" required></div><div><label>ชื่อจดทะเบียน *</label><input id="Registered_Name" required></div><div><label>ชื่อลูกค้า *</label><input id="Customer_Name" required></div><div><label>เลขทะเบียนนิติบุคคล</label><input id="registration_number"></div><div><label>ประเภทธุรกิจ</label><select id="business_type"><option></option><option>รับเหมาก่อสร้าง</option><option>ร้านค้าช่วง</option><option>อสังหาริมทรัพย์</option><option>หน่วยงานราชการ</option><option>อื่นๆ</option></select></div><div><label>ประเภทคำขอ</label><select id="Type_Request"><option>คำขอเปิดวงเงินลูกค้าใหม่</option><option>คำขอเพิ่มวงเงิน</option></select></div></div></section><section class="card"><h2>ที่อยู่และการติดต่อ</h2><div class="grid"><div class="wide"><label>Address</label><textarea id="Address" rows="3"></textarea></div><div><label>จังหวัด</label><input id="province"></div><div><label>อำเภอ/เขต</label><input id="district"></div><div><label>ตำบล/แขวง</label><input id="county"></div><div><label>รหัสไปรษณีย์</label><input id="Postcode"></div><div><label>ชื่อผู้ติดต่อ</label><input id="contact_name"></div><div><label>เบอร์โทร</label><input id="contact_number"></div></div></section><section class="card"><h2>ข้อมูลวงเงิน</h2><div class="grid"><div><label>วงเงินที่ขอ</label><input id="limit"></div><div><label>วงเงินอนุมัติ</label><input id="CraditApprove"></div><div><label>เครดิตเทอม</label><select id="credit_semester1"><option>30</option><option>60</option></select></div></div></section><div class="actions"><button type="button" id="draft">บันทึก Draft ในเครื่อง</button><button class="submit" id="send" disabled>ส่งเข้า SharePoint</button></div></form></main><script>
const C=window.KYC_CONFIG,$=x=>document.getElementById(x);let account;
const app=new msal.PublicClientApplication({auth:{clientId:C.clientId,authority:`https://login.microsoftonline.com/${C.tenantId}`,redirectUri:location.origin+location.pathname},cache:{cacheLocation:'sessionStorage'}});
function show(t,e=false){$('msg').textContent=t;$('msg').className='msg '+(e?'err':'ok')}
async function init(){await app.initialize();await app.handleRedirectPromise();account=app.getAllAccounts()[0];render();restore()}
function render(){$('who').textContent=account?(account.name||account.username):'ยังไม่ได้เข้าสู่ระบบ';$('send').disabled=!account}
$('login').onclick=async()=>{try{account=(await app.loginPopup({scopes:C.scopes,prompt:'select_account'})).account;render();show('เข้าสู่ระบบสำเร็จ')}catch(e){show(e.message,true)}};
async function token(){try{return(await app.acquireTokenSilent({scopes:C.scopes,account})).accessToken}catch{return(await app.acquireTokenPopup({scopes:C.scopes,account})).accessToken}}
async function graph(path,opt={}){const r=await fetch('https://graph.microsoft.com/v1.0'+path,{...opt,headers:{Authorization:'Bearer '+await token(),'Content-Type':'application/json'}}),b=await r.json();if(!r.ok)throw Error(b.error?.message||r.status);return b}
async function targets(){const s=await graph(`/sites/${C.sharePointHost}:${C.sitePath}`),ls=await graph(`/sites/${s.id}/lists?$select=id,displayName`),l=ls.value.find(x=>x.displayName===C.listName);if(!l)throw Error('ไม่พบ List '+C.listName);return[s.id,l.id]}
const v=x=>$(x).value.trim();function fields(){return{Title:v('Registered_Name'),Registered_Name:v('Registered_Name'),Customer_id:v('Customer_id'),'Customer Name':v('Customer_Name'),registration_number:v('registration_number'),business_type:v('business_type'),Type_Request:v('Type_Request'),Address:v('Address'),province:v('province'),district:v('district'),county:v('county'),Postcode:v('Postcode'),contact_name:v('contact_name'),contact_number:v('contact_number'),limit:v('limit'),CraditApprove:v('CraditApprove'),credit_semester1:v('credit_semester1'),Status:'Draft','Request TimeStamp':new Date().toISOString()}}
$('form').onsubmit=async e=>{e.preventDefault();$('send').disabled=true;try{const[s,l]=await targets(),r=await graph(`/sites/${s}/lists/${l}/items`,{method:'POST',body:JSON.stringify({fields:fields()})});localStorage.removeItem('kycDraft');$('form').reset();show('บันทึกสำเร็จ ID: '+r.id)}catch(x){show('บันทึกไม่สำเร็จ: '+x.message,true)}finally{$('send').disabled=!account}};
$('draft').onclick=()=>{const d={};document.querySelectorAll('input,select,textarea').forEach(x=>d[x.id]=x.value);localStorage.setItem('kycDraft',JSON.stringify(d));show('บันทึก Draft ในเครื่องแล้ว')};function restore(){try{for(const[k,v]of Object.entries(JSON.parse(localStorage.getItem('kycDraft')||'{}')))if($(k))$(k).value=v}catch{}}init().catch(e=>show(e.message,true));
</script></body></html>
