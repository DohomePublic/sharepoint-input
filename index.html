<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin KYC Entry</title><script src="https://alcdn.msauth.net/browser/2.39.0/js/msal-browser.min.js"></script><style>:root{--b:#0f6cbd;--bg:#f4f7fb;--c:#fff;--t:#17233b;--m:#667085;--l:#dce5f0;--ok:#107c10;--er:#c4314b}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Tahoma,sans-serif;background:var(--bg);color:var(--t)}header{padding:24px;color:#fff;background:linear-gradient(125deg,#073763,#0f6cbd,#39a9e8)}header h1{margin:0}.sub{margin-top:5px;opacity:.9}.wrap{max-width:850px;margin:25px auto;padding:0 16px}.card{background:var(--c);border:1px solid var(--l);border-radius:18px;box-shadow:0 12px 30px #17365d18;padding:24px}.status{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--l)}button{border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer}.primary{background:var(--b);color:#fff}.secondary{background:#eaf3fc;color:#0b568f}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}.req{color:var(--er)}input{width:100%;padding:12px;border:1px solid #cbd6e2;border-radius:10px;font:inherit}input:focus{outline:2px solid #b9dcfa;border-color:var(--b)}.actions{display:flex;gap:10px;margin-top:22px}.msg{display:none;margin-top:18px;padding:13px;border-radius:10px;white-space:pre-wrap;word-break:break-word}.ok{display:block;background:#e8f6e8;color:#126b12}.err{display:block;background:#fdeaea;color:#a61b1b}.wait{display:block;background:#fff4d6;color:#835b00}.hint{color:var(--m);font-size:12px;margin-top:16px}@media(max-width:650px){.grid{grid-template-columns:1fr}.card{padding:18px}}</style></head><body><header><h1>Admin KYC</h1><div class="sub">แบบฟอร์มบันทึกข้อมูลเข้า SharePoint List Admin_Kyc</div></header><main class="wrap"><section class="card"><div class="status"><div><b id="who">ยังไม่ได้เข้าสู่ระบบ</b><div class="hint">ลงชื่อเข้าใช้บัญชี Microsoft 365 ก่อนบันทึก</div></div><div><button id="login" class="secondary">เข้าสู่ระบบ</button> <button id="logout" class="secondary" hidden>ออกจากระบบ</button></div></div><div id="message" class="msg"></div><form id="form"><div class="grid"><div class="field"><label for="Title">รหัสพนักงาน <span class="req">*</span></label><input id="Title" name="Title" inputmode="numeric" placeholder="เช่น 1046553" required maxlength="255"></div><div class="field"><label for="Email">Email <span class="req">*</span></label><input id="Email" name="Email" type="email" placeholder="name@dohome.co.th" required maxlength="255"></div><div class="field"><label for="Full_Name">ชื่อ - นามสกุล <span class="req">*</span></label><input id="Full_Name" name="Full_Name" placeholder="เช่น Jumbo Pongsapan" required maxlength="255"></div><div class="field"><label for="depart">แผนก <span class="req">*</span></label><input id="depart" name="depart" placeholder="เช่น IT" required maxlength="255"></div></div><div class="actions"><button class="primary" type="submit" id="save">บันทึกเข้า SharePoint</button><button class="secondary" type="reset">ล้างข้อมูล</button></div></form><div class="hint">ปลายทาง: dohomegroup.sharepoint.com/sites/KYC • List: Admin_Kyc</div></section></main><script>
const CONFIG={tenantId:'7f8918d9-718a-495b-ac9a-17cba381c4a0',clientId:'012ac5e6-9487-4436-9e0e-246c19ab2a67',redirectUri:'https://dohomepublic.github.io/sharepoint-web/',siteHost:'dohomegroup.sharepoint.com',sitePath:'/sites/KYC',listName:'Admin_Kyc',scopes:['Sites.ReadWrite.All']};
(()=>{'use strict';const $=id=>document.getElementById(id);let app,account,siteId,listId;function msg(text,type){$('message').className='msg '+type;$('message').textContent=text}function showUser(){$('who').textContent=account?'เข้าสู่ระบบ: '+(account.name||account.username):'ยังไม่ได้เข้าสู่ระบบ';$('logout').hidden=!account}async function init(){if(!window.msal)throw new Error('โหลดระบบเข้าสู่ระบบ Microsoft ไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ต');app=new msal.PublicClientApplication({auth:{clientId:CONFIG.clientId,authority:'https://login.microsoftonline.com/'+CONFIG.tenantId,redirectUri:CONFIG.redirectUri},cache:{cacheLocation:'sessionStorage'}});await app.initialize();account=app.getAllAccounts()[0]||null;showUser()}async function signin(){const r=await app.loginPopup({scopes:CONFIG.scopes,prompt:'select_account'});account=r.account;showUser();return account}async function token(){if(!account)await signin();try{return(await app.acquireTokenSilent({account,scopes:CONFIG.scopes})).accessToken}catch{return(await app.acquireTokenPopup({account,scopes:CONFIG.scopes})).accessToken}}async function graph(url,options={}){const access=await token();const r=await fetch(url,{...options,headers:{Authorization:'Bearer '+access,'Content-Type':'application/json',...(options.headers||{})}});if(!r.ok)throw new Error('Graph API '+r.status+': '+await r.text());return r.json()}async function resolveIds(){if(!siteId){const s=await graph('https://graph.microsoft.com/v1.0/sites/'+CONFIG.siteHost+':'+CONFIG.sitePath);siteId=s.id}if(!listId){const j=await graph('https://graph.microsoft.com/v1.0/sites/'+siteId+'/lists?$select=id,displayName');const list=(j.value||[]).find(x=>x.displayName.toLowerCase()===CONFIG.listName.toLowerCase());if(!list)throw new Error('ไม่พบ SharePoint List '+CONFIG.listName);listId=list.id}}$('login').onclick=()=>signin().catch(e=>msg(e.message,'err'));$('logout').onclick=()=>app.logoutPopup({account,postLogoutRedirectUri:CONFIG.redirectUri});$('form').onsubmit=async e=>{e.preventDefault();if(!e.target.reportValidity())return;$('save').disabled=true;msg('กำลังบันทึกข้อมูล...','wait');try{await resolveIds();const fields={Title:$('Title').value.trim(),Email:$('Email').value.trim(),Full_Name:$('Full_Name').value.trim(),depart:$('depart').value.trim()};const item=await graph('https://graph.microsoft.com/v1.0/sites/'+siteId+'/lists/'+listId+'/items',{method:'POST',body:JSON.stringify({fields})});msg('บันทึกสำเร็จ\nItem ID: '+item.id,'ok');e.target.reset()}catch(err){msg('บันทึกไม่สำเร็จ\n'+err.message,'err')}finally{$('save').disabled=false}};init().catch(e=>msg(e.message,'err'))})();
</script></body></html>
